name: Track op.gg

# GitHub runs 5-minute schedules very late on small repos (sometimes hours), so each run keeps checking
# op.gg every ~4 minutes for ~50 minutes and then starts the next run itself. The hourly schedule is
# only a backup that restarts the chain if it ever stops.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: track
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cache browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-1.48.2
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Check op.gg every ~4 minutes for ~50 minutes
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          end=$(( $(date +%s) + 50*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            start=$(date +%s)
            git pull -q --rebase -X theirs origin main || git rebase --abort || true
            node run.mjs || echo "check failed - trying again next round"
            ./scripts/save.sh || echo "save failed - trying again next round"
            wait=$(( 240 - ($(date +%s) - start) )); [ "$wait" -gt 0 ] && sleep "$wait"
          done
      - name: Start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run track.yml --ref main -R "${{ github.repository }}"
