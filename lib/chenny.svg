<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 220" role="img" aria-label="Cartoon of Chenny yelling into his headset">
  <defs>
    <path id="heart" d="M0 3C-1-1-7-1-7 4c0 4 7 8 7 8s7-4 7-8c0-5-6-5-7-1z"/>
  </defs>
  <!-- gaming chair -->
  <path d="M55 92q0-56 75-56t75 56v128H55z" fill="#1d1f2b" stroke="#0b0c12" stroke-width="3"/>
  <!-- body / black tee -->
  <path d="M38 220q4-52 52-60l40 10 40-10q48 8 52 60z" fill="#15161c" stroke="#000" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M108 163q22 16 44 0" fill="none" stroke="#000" stroke-width="3"/>
  <!-- neck -->
  <path d="M112 146h36v20q-18 10-36 0z" fill="#e9b59a" stroke="#000" stroke-width="3"/>
  <!-- head -->
  <path d="M82 96q-2-46 48-48t50 48q2 34-14 50-14 14-36 14t-36-14q-14-16-12-50z" fill="#f2c2a6" stroke="#000" stroke-width="3.5"/>
  <!-- ears -->
  <ellipse cx="80" cy="104" rx="8" ry="12" fill="#eab398" stroke="#000" stroke-width="3"/>
  <ellipse cx="180" cy="104" rx="8" ry="12" fill="#eab398" stroke="#000" stroke-width="3"/>
  <!-- messy hair -->
  <path d="M80 92q-6-34 22-46q-6-10 8-14q2 8 10 6q4-12 18-8q-2 8 6 10q12-8 22 2q-8 4-4 10q16 6 18 40q-10-14-22-18q2 8-6 12q-4-10-16-12q0 8-10 8q-2-8-12-10q-4 8-14 6q4-6 0-10q-12 6-20 24z" fill="#a7814f" stroke="#000" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- angry brows -->
  <path d="M96 92l26 8M164 92l-26 8" stroke="#5c4026" stroke-width="6" stroke-linecap="round"/>
  <!-- squinting eyes -->
  <path d="M100 106q10 6 20 1M140 107q10 5 20-1" fill="none" stroke="#000" stroke-width="4" stroke-linecap="round"/>
  <!-- nose -->
  <path d="M130 108q-6 14 2 18" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round"/>
  <!-- yelling mouth -->
  <path d="M110 129q20-7 40 0q2 28-20 30q-22-2-20-30z" fill="#5a1414" stroke="#000" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M113 133q17-5 34 0v4q-17-3-34 0z" fill="#fff"/>
  <path d="M119 150q11-8 22 0q-11 7-22 0z" fill="#e2626b"/>
  <!-- headset -->
  <path d="M76 100q-2-66 54-66t54 66" fill="none" stroke="#111" stroke-width="9" stroke-linecap="round"/>
  <path d="M76 100q-2-66 54-66t54 66" fill="none" stroke="#3a6cf4" stroke-width="2.5" stroke-linecap="round" opacity=".8"/>
  <rect x="62" y="88" width="20" height="34" rx="9" fill="#111" stroke="#000" stroke-width="3"/>
  <rect x="178" y="88" width="20" height="34" rx="9" fill="#111" stroke="#000" stroke-width="3"/>
  <rect x="66" y="96" width="5" height="18" rx="2.5" fill="#5383e8"/>
  <rect x="189" y="96" width="5" height="18" rx="2.5" fill="#5383e8"/>
  <path d="M74 118q8 22 34 20" fill="none" stroke="#111" stroke-width="4" stroke-linecap="round"/>
  <circle cx="108" cy="138" r="4" fill="#111"/>
  <!-- yell lines -->
  <path d="M188 136l14 6M190 148l14 12M184 158l8 14" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".85"/>
  <!-- floating hearts -->
  <g fill="#ff6b9a" stroke="#000" stroke-width="1.2">
    <use href="#heart" transform="translate(28 40) scale(1.5)"/>
    <use href="#heart" transform="translate(232 60) scale(1.3)"/>
    <use href="#heart" transform="translate(30 140) scale(1.1)"/>
    <use href="#heart" transform="translate(222 170) scale(1.6)"/>
    <use href="#heart" transform="translate(58 182) scale(.9)"/>
    <use href="#heart" transform="translate(206 22) scale(.9)"/>
  </g>
