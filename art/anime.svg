<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffeadf"/><stop offset="1" stop-color="#f7cdb9"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a77a4c"/><stop offset=".6" stop-color="#7d5631"/><stop offset="1" stop-color="#5c3d21"/>
    </linearGradient>
    <linearGradient id="tee" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2b36"/><stop offset="1" stop-color="#121219"/>
    </linearGradient>
    <linearGradient id="chair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c3150"/><stop offset="1" stop-color="#171a2c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8fb6ff" stop-opacity=".9"/><stop offset="1" stop-color="#3a6cf4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- gaming chair behind -->
  <path d="M96 150q0-70 104-74t104 74v290H96z" fill="url(#chair)" stroke="#0c0d18" stroke-width="4"/>

  <!-- body: black crewneck tee -->
  <path d="M60 440c4-62 40-96 96-104l44 10 44-10c56 8 92 42 96 104z" fill="url(#tee)" stroke="#08080d" stroke-width="4" stroke-linejoin="round"/>
  <path d="M164 336q36 30 72 0" fill="none" stroke="#08080d" stroke-width="5"/>
  <path d="M110 372q-6 34-2 68M290 372q6 34 2 68" stroke="#3a3b48" stroke-width="3" fill="none"/>

  <g transform="rotate(-5 200 210) translate(200 0) scale(1.12 1.04) translate(-200 -6)">
    <!-- neck -->
    <path d="M170 290h60v50q-30 16-60 0z" fill="#efbfa8" stroke="#5a3a22" stroke-width="3.5"/>
    <path d="M172 300q28 14 56 0" stroke="#d99e86" stroke-width="6" fill="none" opacity=".7"/>

    <!-- face: broad, longer jaw (closer to him) -->
    <path d="M112 158C112 100 150 76 200 76s88 24 88 82c0 60-6 92-24 122-16 26-38 40-64 40s-48-14-64-40c-18-30-24-62-24-122z" fill="url(#skin)" stroke="#5a3a22" stroke-width="4"/>
    <!-- ears -->
    <path d="M114 180c-18-4-22 24-6 34 6 4 10 3 12 1z" fill="#f6cbb6" stroke="#5a3a22" stroke-width="3.5"/>
    <path d="M286 180c18-4 22 24 6 34-6 4-10 3-12 1z" fill="#f6cbb6" stroke="#5a3a22" stroke-width="3.5"/>

    <!-- furrowed brows angled down to the middle -->
    <path d="M134 166q24-2 50 14" stroke="#5c3d21" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M266 164q-24-2-50 14" stroke="#5c3d21" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M194 176l3 10M206 176l-3 10" stroke="#d7a08a" stroke-width="2.5" stroke-linecap="round"/>
    <!-- squinting anime eyes -->
    <path d="M138 196q22-14 46 0q-22 8-46 0z" fill="#fff" stroke="#3a2516" stroke-width="2"/>
    <path d="M152 191q10-4 18 0q2 7-9 8-11-1-9-8z" fill="#3c5fa8"/>
    <circle cx="157" cy="192" r="2.5" fill="#fff"/>
    <path d="M134 196q26-20 54 -2" stroke="#2a1a10" stroke-width="5.5" fill="none" stroke-linecap="round"/>
    <path d="M140 202q20 6 42 0" stroke="#a8705a" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M216 196q22-14 46 0q-22 8-46 0z" fill="#fff" stroke="#3a2516" stroke-width="2"/>
    <path d="M230 191q10-4 18 0q2 7-9 8-11-1-9-8z" fill="#3c5fa8"/>
    <circle cx="235" cy="192" r="2.5" fill="#fff"/>
    <path d="M212 194q28-18 54 2" stroke="#2a1a10" stroke-width="5.5" fill="none" stroke-linecap="round"/>
    <path d="M218 202q20 6 42 0" stroke="#a8705a" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- nose -->
    <path d="M202 206q-8 20 0 28q6 2 10-2" stroke="#c98a72" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- light blush -->
    <ellipse cx="146" cy="230" rx="18" ry="8" fill="#ff9aa8" opacity=".35"/>
    <ellipse cx="256" cy="230" rx="18" ry="8" fill="#ff9aa8" opacity=".35"/>
    <!-- shouting mouth, top teeth showing -->
    <path d="M174 252q26-8 52 0q8 22-2 40-10 14-24 14t-24-14q-10-18-2-40z" fill="#6e1c26" stroke="#3a1414" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M176 254q24-7 48 0l-1 8q-23-6-46 0z" fill="#fff"/>
    <path d="M186 292q14-8 28 0-4 10-14 11-10-1-14-11z" fill="#e2626b"/>

    <!-- messy hair with fringe swept down across the forehead -->
    <path d="M98 150c-8-40 6-74 30-92-6-10 0-20 12-22 0 8 6 12 12 12 4-14 18-22 32-18-4 8-2 14 6 16 10-12 28-14 40-6-8 4-10 10-6 16 14-6 30-2 40 10-8 0-12 4-12 10 18 4 32 22 36 46 6 26 2 50-10 70z" fill="url(#hair)" stroke="#3e2914" stroke-width="4" stroke-linejoin="round"/>
    <path d="M104 176C92 102 136 56 200 54s118 40 102 116c-6-24-14-40-26-52 4 20 2 34-4 46-6-22-18-38-32-48 2 16-2 28-10 36-4-14-10-24-20-32-2 20-14 36-30 46 8-18 8-34 2-48-8 22-24 38-44 48 10-16 12-30 8-44-12 18-26 32-42 42z" fill="url(#hair)" stroke="#3e2914" stroke-width="4" stroke-linejoin="round"/>
    <!-- long strands falling over the forehead toward his left eye -->
    <path d="M196 92c-6 30-2 58 14 84-24-20-34-48-30-80z" fill="url(#hair)" stroke="#3e2914" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M226 98c4 26 14 46 32 60-28-8-44-30-46-56z" fill="url(#hair)" stroke="#3e2914" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M160 70c-10-14-4-26 10-30-2 10 2 18 10 24z M232 64c6-14 20-18 30-12-10 4-14 10-14 18z" fill="url(#hair)" stroke="#3e2914" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M162 100c-10 24-8 46 4 66-18-12-26-34-22-60z M252 110c10 16 22 26 36 30-22 2-38-10-44-26z" fill="url(#hair)" stroke="#3e2914" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- hair shine -->
    <path d="M140 102q26-24 56-28M224 74q30 4 50 22" stroke="#c99b66" stroke-width="5" fill="none" stroke-linecap="round" opacity=".9"/>

    <!-- black headset with blue glow -->
    <path d="M100 184C94 92 140 44 200 44s106 48 100 140" fill="none" stroke="#14141c" stroke-width="15" stroke-linecap="round"/>
    <path d="M106 160C110 88 148 54 200 54s92 34 94 104" fill="none" stroke="#4d7ef0" stroke-width="2.5" stroke-linecap="round" opacity=".8"/>
    <ellipse cx="96" cy="200" rx="32" ry="40" fill="url(#glow)"/>
    <ellipse cx="304" cy="200" rx="32" ry="40" fill="url(#glow)"/>
    <rect x="78" y="166" width="36" height="66" rx="16" fill="#18181f" stroke="#08080d" stroke-width="4"/>
    <rect x="286" y="166" width="36" height="66" rx="16" fill="#18181f" stroke="#08080d" stroke-width="4"/>
    <rect x="85" y="180" width="7" height="38" rx="3.5" fill="#6fa2ff"/>
    <rect x="308" y="180" width="7" height="38" rx="3.5" fill="#6fa2ff"/>
  </g>

  <!-- shout lines -->
  <path d="M318 262l26-6M320 280l28 8M314 298l20 18" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".85"/>
</svg>
