<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440">
  <defs>
    <radialGradient id="skin" cx="50%" cy="40%" r="65%">
      <stop offset="0" stop-color="#fff0e6"/><stop offset=".75" stop-color="#ffe0cf"/><stop offset="1" stop-color="#f6c7b0"/>
    </radialGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d7a86e"/><stop offset=".55" stop-color="#b9894f"/><stop offset="1" stop-color="#8f6337"/>
    </linearGradient>
    <linearGradient id="iris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3f82"/><stop offset=".55" stop-color="#4f7fd6"/><stop offset="1" stop-color="#9fd0ff"/>
    </linearGradient>
    <linearGradient id="tee" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2c38"/><stop offset="1" stop-color="#14151c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#9cc4ff"/><stop offset="1" stop-color="#3a6cf4" stop-opacity="0"/>
    </radialGradient>
    <g id="eye">
      <!-- white -->
      <path d="M-34 4C-34-26-16-40 0-40S34-26 34 4 18 42 0 42-34 34-34 4z" fill="#fff"/>
      <!-- iris -->
      <ellipse cx="0" cy="6" rx="26" ry="33" fill="url(#iris)"/>
      <ellipse cx="0" cy="8" rx="13" ry="18" fill="#141c3e"/>
      <path d="M-20 20q20 16 40 0" stroke="#bfe3ff" stroke-width="4" fill="none" opacity=".8"/>
      <!-- sparkles -->
      <ellipse cx="-10" cy="-8" rx="10" ry="12" fill="#fff"/>
      <circle cx="12" cy="20" r="5" fill="#fff"/>
      <circle cx="-14" cy="22" r="2.5" fill="#fff" opacity=".9"/>
      <!-- upper lash line -->
      <path d="M-38 -6C-30-36-8-46 6-44S36-30 40-8l4-2C40-34 18-52 2-50S-34-40-44-6z" fill="#3a2516"/>
      <path d="M36 -12l12-8-6 12z M-40 -8l-10-6 4 10z" fill="#3a2516"/>
      <path d="M-26 40q26 8 52 0" stroke="#c98c76" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </g>
    <path id="spark" d="M0-10C1-3 3-1 10 0 3 1 1 3 0 10-1 3-3 1-10 0-3-1-1-3 0-10z"/>
  </defs>

  <!-- back hair -->
  <path d="M78 190C60 110 110 52 200 50s146 54 124 140c-6 30-10 48-20 64H96c-10-16-14-36-18-64z" fill="url(#hair)" stroke="#5e3f22" stroke-width="4"/>

  <!-- body: black tee -->
  <path d="M86 440c2-58 30-92 74-100h80c44 8 72 42 74 100z" fill="url(#tee)" stroke="#0a0a10" stroke-width="4" stroke-linejoin="round"/>
  <path d="M168 342q32 26 64 0" fill="none" stroke="#0a0a10" stroke-width="4"/>
  <path d="M124 380q-6 30-4 60M276 380q6 30 4 60" stroke="#3b3d4c" stroke-width="3" fill="none"/>
  <!-- neck -->
  <path d="M176 300h48v40q-24 14-48 0z" fill="#f2c2aa" stroke="#5e3f22" stroke-width="3.5"/>

  <!-- face -->
  <path d="M96 176C96 104 140 76 200 76s104 28 104 100c0 66-26 104-52 124-18 14-34 20-52 20s-34-6-52-20c-26-20-52-58-52-124z" fill="url(#skin)" stroke="#5e3f22" stroke-width="4"/>
  <!-- ears -->
  <path d="M98 190c-20-6-26 26-8 38 6 4 12 4 14 2z" fill="#ffd9c6" stroke="#5e3f22" stroke-width="3.5"/>
  <path d="M302 190c20-6 26 26 8 38-6 4-12 4-14 2z" fill="#ffd9c6" stroke="#5e3f22" stroke-width="3.5"/>

  <!-- eyes -->
  <use href="#eye" transform="translate(150 206) scale(.95)"/>
  <use href="#eye" transform="translate(250 206) scale(-.95 .95)"/>
  <!-- brows (happy, raised) -->
  <path d="M120 148q22-12 46-4M234 144q24-8 46 4" stroke="#7a5230" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- blush -->
  <ellipse cx="118" cy="258" rx="22" ry="12" fill="#ff8fa8" opacity=".55"/>
  <ellipse cx="282" cy="258" rx="22" ry="12" fill="#ff8fa8" opacity=".55"/>
  <path d="M108 254l6-8M118 256l6-8M128 254l6-8M272 254l6-8M282 256l6-8M292 254l6-8" stroke="#ff6b8e" stroke-width="2.5" stroke-linecap="round" opacity=".8"/>
  <!-- nose -->
  <path d="M198 244q4 4 0 8" stroke="#d99a82" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- big happy open mouth (cute yell) -->
  <path d="M168 270q32 8 64 0q-4 38-32 40-28-2-32-40z" fill="#8a2433" stroke="#4a1a1a" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M171 271q29 7 58 0l-1 6q-28 6-56 0z" fill="#fff"/>
  <path d="M182 298q18-12 36 0-6 10-18 11-12-1-18-11z" fill="#ff7f8e"/>
  <path d="M176 272l4 9 4-8z" fill="#fff"/>

  <!-- front hair: messy anime bangs -->
  <path d="M90 186C82 112 128 66 200 64s124 42 112 122c-8-20-16-34-26-44 2 18-2 30-8 40-4-20-14-36-26-46 0 18-6 30-14 38-2-20-10-34-22-44-4 18-12 30-22 36 0-18-4-30-12-40-8 16-18 26-30 32 4-16 4-28 0-38-12 14-22 22-34 26 6-12 8-22 6-32-14 12-22 20-36 32z" fill="url(#hair)" stroke="#5e3f22" stroke-width="4" stroke-linejoin="round"/>
  <!-- ahoge -->
  <path d="M204 66c-6-26 6-44 26-48-14 12-16 28-10 46z" fill="url(#hair)" stroke="#5e3f22" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- hair shine -->
  <path d="M130 108q30-24 70-26M216 84q36 2 62 22" stroke="#f3d3a2" stroke-width="7" fill="none" stroke-linecap="round" opacity=".85"/>
  <path d="M150 100l10 16M240 92l-6 18" stroke="#f3d3a2" stroke-width="4" stroke-linecap="round" opacity=".7"/>

  <!-- headset -->
  <path d="M84 196C78 92 132 40 200 40s122 52 116 156" fill="none" stroke="#17171f" stroke-width="16" stroke-linecap="round"/>
  <path d="M90 170C92 90 138 50 200 50s108 40 110 120" fill="none" stroke="#4d7ef0" stroke-width="3" stroke-linecap="round" opacity=".9"/>
  <ellipse cx="82" cy="214" rx="30" ry="36" fill="url(#glow)" opacity=".6"/>
  <ellipse cx="318" cy="214" rx="30" ry="36" fill="url(#glow)" opacity=".6"/>
  <rect x="62" y="180" width="38" height="66" rx="18" fill="#1b1b24" stroke="#0a0a10" stroke-width="4"/>
  <rect x="300" y="180" width="38" height="66" rx="18" fill="#1b1b24" stroke="#0a0a10" stroke-width="4"/>
  <rect x="70" y="194" width="8" height="38" rx="4" fill="#7fb0ff"/>
  <rect x="322" y="194" width="8" height="38" rx="4" fill="#7fb0ff"/>
  <path d="M84 238q4 46 66 50" fill="none" stroke="#17171f" stroke-width="7" stroke-linecap="round"/>
  <circle cx="152" cy="288" r="9" fill="#17171f"/>

  <!-- sparkles around -->
  <g fill="#fff6b0">
    <use href="#spark" transform="translate(44 92) scale(1.4)"/>
    <use href="#spark" transform="translate(356 76) scale(1.1)"/>
    <use href="#spark" transform="translate(360 300) scale(.9)"/>
    <use href="#spark" transform="translate(36 300) scale(.8)"/>
  </g>
</svg>
